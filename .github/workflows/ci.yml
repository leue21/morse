# Checks every push and pull request. release.yml runs the same tests, but only
# once a tag is pushed — by which point a broken change is already on main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # gofmt -l prints the files it would change, and exits 0 either way.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # -race because a FakeAPI handler runs on the server's goroutine while
      # the test reads what it recorded.
      - run: go test -race -count=1 ./...

      # The release builds every platform; building them here too means a
      # change that breaks one (a syscall that does not exist on Windows) is
      # found in its pull request, not when a tag is pushed.
      - name: Build every release platform
        run: scripts/build-release.sh "ci-${GITHUB_SHA::7}" dist

  # install.sh against archives this commit built, served from disk, so a
  # change to the archive layout and the script that unpacks it are checked
  # together. macOS too: its shasum, mktemp and uname differ from Linux's.
  install-script:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/build-release.sh

      - name: Install from locally built archives
        run: |
          scripts/build-release.sh v0.0.0-ci dist
          MORSE_BASE_URL="file://$PWD/dist" MORSE_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/morse" version | grep -qx 'morse v0.0.0-ci'
